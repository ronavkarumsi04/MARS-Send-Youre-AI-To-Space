name: Desktop installers

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    paths: &desktop-paths
      - ".github/workflows/desktop.yml"
      - ".bun-version"
      - "apps/shell/**"
      - "bun.lock"
      - "package.json"
      - "packages/**"
  pull_request:
    paths: *desktop-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            artifact: MARS-macOS-Apple-Silicon
          - runner: macos-15-intel
            arch: x64
            artifact: MARS-macOS-Intel
          - runner: ubuntu-24.04
            arch: x64
            artifact: MARS-Ubuntu-Debian-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install locked dependencies and Electron
        run: |
          test "$(bun -p 'process.arch')" = "${{ matrix.arch }}"
          bun install --frozen-lockfile --ignore-scripts
          bun run --cwd apps/shell native:install
      - name: Build and smoke-test the bundled workbench
        run: bun run --cwd apps/shell package
      - name: Smoke-test the installed desktop window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb "$PWD"/apps/shell/dist/installers/*.deb
          MARS_PACKAGED_ELECTRON=/opt/mars/mars bun test apps/shell/test/electron-xvfb.test.ts -t 'installed MARS'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: apps/shell/dist/installers/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish desktop installers
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'ronavkarumsi04/MARS-Send-Youre-AI-To-Space'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: desktop-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: MARS-*
          path: installers
      - name: Attach installers to the tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            installers/MARS-macOS-Apple-Silicon/MARS-*-macOS-arm64.dmg
            installers/MARS-macOS-Intel/MARS-*-macOS-x64.dmg
            installers/MARS-Ubuntu-Debian-x64/MARS-*-linux-amd64.deb
          )
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "Missing release installer: $asset" >&2
              exit 1
            fi
          done
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
